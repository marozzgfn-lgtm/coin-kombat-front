<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Coin Kombat Dram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0c10;
      color: #ffffff;
      margin: 0;
      padding: 0;
      padding-bottom: 75px;
      min-height: 100vh;
    }
    .container { padding: 16px; text-align: center; }
    .level-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .level-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9800, #ffd700);
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    .vip-status {
      display: inline-block;
      background: #222;
      border: 1px solid #444;
      color: #888;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .vip-status.active {
      background: linear-gradient(90deg, #ffd700, #ff9800);
      color: #000;
      border: none;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }
    .header-stats {
      display: flex;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .coin-display {
      font-size: 36px;
      font-weight: 900;
      color: #ffd700;
      margin: 10px 0;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
    }
    .click-area {
      position: relative;
      margin: 20px auto;
      width: 220px;
      height: 220px;
    }
    .click-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #2a1b4e 0%, #140d28 100%);
      border: 6px solid #ff9800;
      box-shadow: 0 0 35px rgba(255, 152, 0, 0.3);
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 85px;
      transition: transform 0.05s ease;
    }
    .click-btn:active { transform: scale(0.93); }
    .floating-text {
      position: absolute;
      font-size: 26px;
      font-weight: bold;
      color: #ffd700;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #12131e;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item {
      color: #777;
      font-size: 11px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .nav-item.active { color: #ff9800; font-weight: bold; }
    .nav-icon { font-size: 20px; }
    .card, .shop-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }
    .btn-action {
      background: #ff9800;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-action:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="level-container">
      <div class="level-header">
        <span id="lvlName">LVL 1</span>
        <span id="lvlRatio">0 / 10,000</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="lvlProgress"></div>
      </div>
    </div>

    <div class="vip-status" id="vipBadge">VIP NOT ACTIVE</div>

    <div class="header-stats">
      <div>Доход: <strong id="profit" style="color:#4caf50">0</strong> /ч</div>
      <div>Энергия: <strong id="energy">500</strong>/500</div>
    </div>

    <div class="coin-display"><span id="coins">0</span> ֏</div>

    <div id="tab-clicker" class="tab-content active">
      <div class="click-area" id="clickArea">
        <button class="click-btn" id="tapBtn">🪙</button>
      </div>
    </div>

    <div id="tab-cards" class="tab-content">
      <h3>Майнинг</h3>
      <div id="cardsList"></div>
    </div>
  </div>

  <div class="navbar">
    <button class="nav-item active" onclick="switchTab('clicker', this)">
      <span class="nav-icon">⚡</span> Игра
    </button>
    <button class="nav-item" onclick="switchTab('cards', this)">
      <span class="nav-icon">📈</span> Майнинг
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp || {};
    if (tg.ready) tg.ready();
    if (tg.expand) tg.expand();

    const userId = tg.initDataUnsafe?.user?.id || 'local_user';

    let state = {
      coins: 0,
      level: 1,
      energy: 500,
      maxEnergy: 500,
      profitPerHour: 0,
      clickPower: 1,
      isVip: false,
      cards: {}
    };

    const CARDS = [
      { id: 'card_1', name: 'Видеокарта', baseCost: 100, profit: 10 },
      { id: 'card_2', name: 'Ферма', baseCost: 500, profit: 50 },
      { id: 'card_3', name: 'Дата-центр', baseCost: 2500, profit: 250 }
    ];

    const LEVEL_THRESHOLDS = [
      { lvl: 1, name: 'LVL 1: Новичок', max: 10000 },
      { lvl: 2, name: 'LVL 2: Боец', max: 50000 },
      { lvl: 3, name: 'LVL 3: Мастер', max: 250000 },
      { lvl: 4, name: 'LVL 4: Легенда', max: 1000000 }
    ];

    function loadData() {
      try {
        const saved = localStorage.getItem(`game_state_${userId}`);
        if (saved) {
          state = { ...state, ...JSON.parse(saved) };
        }
      } catch (e) {}
    }

    function saveData() {
      try {
        localStorage.setItem(`game_state_${userId}`, JSON.stringify(state));
      } catch (e) {}
    }

    function updateUI() {
      document.getElementById('coins').innerText = Math.floor(state.coins).toLocaleString();
      document.getElementById('energy').innerText = `${state.energy}/${state.maxEnergy}`;
      document.getElementById('profit').innerText = state.profitPerHour.toLocaleString();

      let currentLvl = LEVEL_THRESHOLDS[0];
      let prevMax = 0;
      for (let i = 0; i < LEVEL_THRESHOLDS.length; i++) {
        if (state.coins >= LEVEL_THRESHOLDS[i].max) {
          prevMax = LEVEL_THRESHOLDS[i].max;
        } else {
          currentLvl = LEVEL_THRESHOLDS[i];
          break;
        }
      }

      state.level = currentLvl.lvl;
      document.getElementById('lvlName').innerText = currentLvl.name;

      const progressCoins = state.coins - prevMax;
      const totalNeeded = currentLvl.max - prevMax;
      const percent = Math.min(100, Math.max(0, (progressCoins / totalNeeded) * 100));

      document.getElementById('lvlRatio').innerText = `${Math.floor(state.coins).toLocaleString()} / ${currentLvl.max.toLocaleString()}`;
      document.getElementById('lvlProgress').style.width = `${percent}%`;

      renderCards();
    }

    document.getElementById('tapBtn').addEventListener('click', (e) => {
      if (state.energy > 0) {
        state.coins += state.clickPower;
        state.energy -= 1;
        saveData();
        updateUI();

        const floatText = document.createElement('div');
        floatText.className = 'floating-text';
        floatText.innerText = `+${state.clickPower}`;
        const rect = document.getElementById('clickArea').getBoundingClientRect();
        floatText.style.left = `${e.clientX - rect.left - 10}px`;
        floatText.style.top = `${e.clientY - rect.top - 20}px`;
        document.getElementById('clickArea').appendChild(floatText);
        setTimeout(() => floatText.remove(), 700);
      }
    });

    function renderCards() {
      const container = document.getElementById('cardsList');
      container.innerHTML = '';

      CARDS.forEach(card => {
        const lvl = state.cards[card.id] || 0;
        const cost = Math.floor(card.baseCost * Math.pow(1.5, lvl));

        container.innerHTML += `
          <div class="card">
            <div>
              <strong>${card.name}</strong><br>
              <small>Ур. ${lvl} | +${card.profit} /ч</small><br>
              <span style="color:#ffd700">${cost.toLocaleString()} ֏</span>
            </div>
            <button class="btn-action" ${state.coins < cost ? 'disabled' : ''} onclick="buyCard('${card.id}', ${cost}, ${card.profit})">
              Купить
            </button>
          </div>
        `;
      });
    }

    function buyCard(cardId, cost, profit) {
      if (state.coins >= cost) {
        state.coins -= cost;
        state.cards[cardId] = (state.cards[cardId] || 0) + 1;
        state.profitPerHour += profit;
        saveData();
        updateUI();
      }
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      el.classList.add('active');
    }

    setInterval(() => {
      if (state.profitPerHour > 0) {
        state.coins += state.profitPerHour / 3600;
      }
      if (state.energy < state.maxEnergy) {
        state.energy = Math.min(state.maxEnergy, state.energy + 1);
      }
      saveData();
      updateUI();
    }, 1000);

    loadData();
    updateUI();
  </script>
</body>
</html>
